name: VitrineMusic
options:
  bundleIdPrefix: com.ncomsystems
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: "Vitrine Music"
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    CODE_SIGNING_ALLOWED: NO
targets:
  VitrineMusic:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ncomsystems.vitrinemusic
        PRODUCT_NAME: "Vitrine Music"
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
