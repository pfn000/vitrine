name: Vitrine Music — iOS Build

on:
  push:
    branches:
      - main
      - feat/standalone-youtube-music-app
    paths:
      - "VitrineMusic/**"
      - ".github/workflows/vitrine-music-build.yml"
  pull_request:
    paths:
      - "VitrineMusic/**"
      - ".github/workflows/vitrine-music-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vitrine-music-build
  cancel-in-progress: true

jobs:
  build:
    name: Compile unsigned iOS app
    runs-on: xcode-27
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Show Xcode toolchain
        run: |
          xcodebuild -version
          xcodebuild -showsdks

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Generate Xcode project
        working-directory: VitrineMusic
        run: xcodegen generate --spec project.yml

      - name: Build for a physical iOS device (unsigned)
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild \
            -project VitrineMusic/VitrineMusic.xcodeproj \
            -scheme VitrineMusic \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/VitrineMusicDerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build | tee build/vitrine-music-build.log

      - name: Package unsigned IPA archive
        run: |
          set -euo pipefail
          APP_PATH="build/VitrineMusicDerivedData/Build/Products/Debug-iphoneos/Vitrine Music.app"
          test -d "$APP_PATH"
          mkdir -p build/ipa/Payload
          ditto "$APP_PATH" "build/ipa/Payload/Vitrine Music.app"
          (
            cd build/ipa
            /usr/bin/zip -qry "../VitrineMusic-unsigned.ipa" Payload
          )
          test -s build/VitrineMusic-unsigned.ipa

      - name: Upload unsigned IPA and build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitrine-music-unsigned-ipa
          path: |
            build/VitrineMusic-unsigned.ipa
            build/vitrine-music-build.log
          if-no-files-found: warn
          retention-days: 7
